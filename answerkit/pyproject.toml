[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "answerkit"
version = "0.1.0"
description = "A lightweight, standalone Python AI SDK for building Q&A applications with Groq, async streaming, model fallback, conversation context, optional Google Serper web search, and prompt enhancement."
readme = "README.md"
authors = [
    { name = "Mahadev Athani", email = "mahadevathani1729@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "ai",
    "sdk",
    "groq",
    "llm",
    "qa",
    "question-answering",
    "search",
    "serper",
    "streaming",
    "rag"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Mahadev1729/QnAChatBot"
Repository = "https://github.com/Mahadev1729/QnAChatBot"
Issues = "https://github.com/Mahadev1729/QnAChatBot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["answerkit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
